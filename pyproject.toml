[project]
name = "doorstep"
version = "0.1.0"
description = "Can anyone still afford a home: a data story in eight chapters over every U.S. metro the public record covers since 2000, with a warehouse, a simulator that proves every estimator, and an affordability calculator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Ajay Mekala" }]
dependencies = [
  "doorstep-core",
  "doorstep-render",
  "doorstep-contracts",
  "doorstep-sim",
  "doorstep-stats",
  "doorstep-finance",
  "doorstep-loans",
  "doorstep-chapters",
  "doorstep-evaluation",
  "doorstep-exports",
  "doorstep-api",
  "doorstep-pipeline",
  "typer>=0.15",
]

[project.scripts]
doorstep = "doorstep_pipeline.cli:app"

[project.optional-dependencies]
warehouse = ["dbt-core>=1.9", "dbt-duckdb>=1.9"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "anyio>=4.6",
  "hypothesis>=6.120",
  "ruff>=0.11",
  "mypy>=1.15",
  "types-PyYAML",
  "nbmake>=1.5",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "httpx>=0.28",
  "playwright>=1.49",
  "pillow>=11.0",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
doorstep-core = { workspace = true }
doorstep-render = { workspace = true }
doorstep-contracts = { workspace = true }
doorstep-sim = { workspace = true }
doorstep-stats = { workspace = true }
doorstep-finance = { workspace = true }
doorstep-loans = { workspace = true }
doorstep-chapters = { workspace = true }
doorstep-evaluation = { workspace = true }
doorstep-exports = { workspace = true }
doorstep-api = { workspace = true }
doorstep-pipeline = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["web", "data", "results", "notebooks", ".cache", "warehouse/target", "warehouse/dbt_packages"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/packages/api/src:$MYPY_CONFIG_FILE_DIR/packages/chapters/src:$MYPY_CONFIG_FILE_DIR/packages/contracts/src:$MYPY_CONFIG_FILE_DIR/packages/core/src:$MYPY_CONFIG_FILE_DIR/packages/evaluation/src:$MYPY_CONFIG_FILE_DIR/packages/exports/src:$MYPY_CONFIG_FILE_DIR/packages/finance/src:$MYPY_CONFIG_FILE_DIR/packages/loans/src:$MYPY_CONFIG_FILE_DIR/packages/pipeline/src:$MYPY_CONFIG_FILE_DIR/packages/render/src:$MYPY_CONFIG_FILE_DIR/packages/sim/src:$MYPY_CONFIG_FILE_DIR/packages/stats/src"
explicit_package_bases = true
files = ["packages/*/src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "postgres: needs a reachable Postgres (DOORSTEP_TEST_DATABASE_URL or local binaries)",
  "external: needs the fetched public files under data/external",
  "derived: needs the derived parquet under data/derived",
  "warehouse: needs the dbt warehouse built under .cache",
  "libreoffice: needs LibreOffice to recalculate the workbook",
  "slow: full pipeline verification",
  "loadtest: runs the load test against a live server",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = false
skip_empty = true
