# Every metric the story, the explorer, the memo, the workbook and the BI extracts use, defined once.
#
# Each metric carries two expressions, and that is the point of the file:
#
#   grain: SQL over the finest table that holds the measure (the census long table for census counts,
#          the county table for permits and population, the loan rows for loans). This is the definition.
#   mart:  SQL over the additive columns of the shipped metro by year mart (mart_metro_year unless
#          mart_source says otherwise), which is what the site's DuckDB-WASM, the workbook and the BI model run.
#
# `doorstep metrics` evaluates both at four grains (overall, by year, by kind, by year and kind) and fails
# when any cell disagrees beyond floating point. A metric layer without that check is a document about the
# code; with it, a mart that drops a filter breaks the build.
#
# `fmt` is the manifest format every surface prints the metric in. `dax` is generated from `mart`.

version: 1

metrics:
  - name: households
    kind: sum
    fmt: int
    description: Households in the metro universe, from census table B11001.
    grain: sum(estimate) filter (where variable = 'B11001_001')
    grain_source: grain_acs
    mart: sum(households)

  - name: owner_households
    kind: sum
    fmt: int
    description: Owner occupied households, census table B25003.
    grain: sum(estimate) filter (where variable = 'B25003_002')
    grain_source: grain_acs
    mart: sum(owner_households)

  - name: renter_households
    kind: sum
    fmt: int
    description: Renter occupied households, census table B25003.
    grain: sum(estimate) filter (where variable = 'B25003_003')
    grain_source: grain_acs
    mart: sum(renter_households)

  - name: renters_burdened
    kind: sum
    fmt: int
    description: Renter households paying thirty percent or more of income in gross rent, census table B25070.
    grain: sum(estimate) filter (where variable in ('B25070_007', 'B25070_008', 'B25070_009', 'B25070_010'))
    grain_source: grain_acs
    mart: sum(renters_burdened)

  - name: renters_severe
    kind: sum
    fmt: int
    description: Renter households paying fifty percent or more of income in gross rent.
    grain: sum(estimate) filter (where variable = 'B25070_010')
    grain_source: grain_acs
    mart: sum(renters_severe)

  - name: renter_burdened_share
    kind: proportion
    fmt: pct1
    description: Burdened renters over renters with a computed rent share.
    grain: sum(estimate) filter (where variable in ('B25070_007', 'B25070_008', 'B25070_009', 'B25070_010')) / (sum(estimate) filter (where variable = 'B25070_001') - coalesce(sum(estimate) filter (where variable = 'B25070_011'), 0))
    grain_source: grain_acs
    mart: sum(renters_burdened) / sum(renters_with_share)

  - name: housing_units
    kind: sum
    fmt: int
    description: Housing units, census table B25001.
    grain: sum(estimate) filter (where variable = 'B25001_001')
    grain_source: grain_acs
    mart: sum(housing_units)

  - name: permits
    kind: sum
    fmt: int
    description: Housing units permitted, every structure size, from the county permit files mapped to their area.
    grain: sum(permits)
    grain_source: grain_counties
    mart: sum(permits)

  - name: population
    kind: sum
    fmt: int
    description: Resident population from the county estimates mapped to their area.
    grain: sum(population)
    grain_source: grain_counties
    mart: sum(population)

  - name: domestic_migration
    kind: sum
    fmt: int
    description: Net domestic migration from the county estimates mapped to their area.
    grain: sum(domestic_migration)
    grain_source: grain_counties
    mart: sum(domestic_migration)

  - name: purchase_loans
    kind: sum
    fmt: int
    description: Originated home purchase loans on principal residences, counted from the loan rows.
    grain: count(*) filter (where loan_purpose = 1)
    grain_source: grain_loans
    mart: sum(purchase_loans)

  - name: refinance_loans
    kind: sum
    fmt: int
    description: Originated refinance and cash out refinance loans on principal residences.
    grain: count(*) filter (where loan_purpose in (31, 32))
    grain_source: grain_loans
    mart: sum(refinance_loans)

  - name: low_rate_originations
    kind: sum
    fmt: int
    description: Thirty year originations under the lock in threshold of four percent.
    grain: count(*) filter (where interest_rate < 4.0 and not q_rate_missing and not q_term_not_30_years)
    grain_source: grain_loans
    mart: sum(low_rate_originations)

  - name: turnover_per_100_owners
    kind: ratio
    fmt: float2
    description: Purchase originations per hundred owner households, the turnover the lock in chapter follows.
    grain: 100.0 * sum(purchase_loans) / sum(owner_households)
    grain_source: fct_metro_year
    mart: 100.0 * sum(purchase_loans) / sum(owner_households)

  - name: lock_in_per_100_owners
    kind: ratio
    fmt: float2
    description: Originations under the lock in threshold per hundred owner households, the lock in intensity of chapter 2.
    grain: 100.0 * sum(low_rate_originations) / sum(owner_households)
    grain_source: fct_metro_year
    mart: 100.0 * sum(low_rate_originations) / sum(owner_households)

  - name: permits_per_100_households
    kind: ratio
    fmt: float2
    description: Units permitted per hundred households, the building rate of chapter 4.
    grain: 100.0 * sum(permits) / sum(households)
    grain_source: fct_metro_year
    mart: 100.0 * sum(permits) / sum(households)

  - name: domestic_migration_per_100
    kind: ratio
    fmt: float2
    description: Net domestic migration per hundred residents, the demand shock of chapter 7.
    grain: 100.0 * sum(domestic_migration) / sum(population)
    grain_source: fct_metro_year
    mart: 100.0 * sum(domestic_migration) / sum(population)

  - name: purchase_under_35_share
    kind: proportion
    fmt: pct1
    description: Purchase loans to borrowers under 35 over purchase loans with a reported age, chapter 6.
    grain: sum(purchase_under_35) / sum(purchase_with_age)
    grain_source: fct_metro_year
    mart: sum(purchase_under_35) / sum(purchase_with_age)

  - name: owner_mortgage_burdened_share
    kind: proportion
    fmt: pct1
    description: Owners with a mortgage paying thirty percent or more of income in owner costs, census table B25091, over owners with a computed share.
    grain: sum(owners_mortgage_burdened) / sum(owners_mortgage_with_share)
    grain_source: fct_metro_year
    mart: sum(owners_mortgage_burdened) / sum(owners_mortgage_with_share)

  - name: payment_share_ratio_of_sums
    kind: ratio
    fmt: pct1
    description: Twelve payments on the anchored median home summed over metro years, over the median incomes summed the same way; the metric layer's check on the payment columns (the chapters weight metros by owner households).
    grain: 12.0 * sum(payment) / sum(median_income)
    grain_source: mart_metro_year
    mart: 12.0 * sum(payment) / sum(median_income)

  - name: price_to_income_ratio_of_sums
    kind: ratio
    fmt: ratio2
    description: Anchored values summed over metro years over median incomes summed the same way; the check on the anchored value column.
    grain: sum(value_anchored) / sum(median_income)
    grain_source: fct_metro_year
    mart: sum(value_anchored) / sum(median_income)
