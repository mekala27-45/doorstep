[project]
name = "doorstep-sim"
version = "0.1.0"
description = "Synthetic metros with known truth: incomes, distributions, elasticities, demand shocks with a reverse causality knob, rates, lock in, planted misreporting"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "doorstep-contracts",
  "doorstep-core",
  "doorstep-finance",
  "numpy>=1.26",
  "polars>=1.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorstep_sim"]
