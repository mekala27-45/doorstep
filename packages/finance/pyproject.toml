[project]
name = "doorstep-finance"
version = "0.1.0"
description = "The amortization engine, the payment share, the affordable price and the rent or buy breakeven, tested to the cent"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "doorstep-core",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorstep_finance"]
