[project]
name = "doorstep-pipeline"
version = "0.1.0"
description = "The command line that runs every stage in order and assembles the manifest"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "doorstep-core",
  "doorstep-render",
  "doorstep-contracts",
  "doorstep-sim",
  "doorstep-stats",
  "doorstep-finance",
  "doorstep-loans",
  "doorstep-chapters",
  "doorstep-evaluation",
  "doorstep-exports",
  "typer>=0.15",
  "duckdb>=1.1,<2",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorstep_pipeline"]
