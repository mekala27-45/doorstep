[project]
name = "doorstep-stats"
version = "0.1.0"
description = "Block bootstrap by quarter, cluster robust errors, Benjamini-Hochberg, PELT, fixed effects on weighted cells, Monte Carlo over survey margins, synthetic control"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "doorstep-core",
  "scipy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorstep_stats"]
