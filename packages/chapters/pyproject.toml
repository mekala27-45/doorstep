[project]
name = "doorstep-chapters"
version = "0.1.0"
description = "The eight chapters: plan, simulator recovery, estimate, chart, method note, pushback"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "doorstep-core",
  "doorstep-stats",
  "doorstep-finance",
  "doorstep-sim",
  "doorstep-loans",
  "duckdb>=1.1,<2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorstep_chapters"]
